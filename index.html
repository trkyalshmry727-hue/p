<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>مترجم الألعاب</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  :root{--fs:40px}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}

  /* الكاميرا فوق وتغطي العرض كامل */
  #camBox{position:relative;flex:0 0 46dvh;background:#000;overflow:hidden}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;transform-origin:50% 50%}
  #overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #camMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
    font-size:18px;color:#bbb;background:#050505;z-index:5}
  #camTools{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:8px;z-index:4}
  #camTools button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);
    color:#fff;font-size:22px;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #zoomTag{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);border-radius:20px;padding:6px 12px;font-size:15px;font-weight:800;z-index:4;pointer-events:none}
  #lensTag{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.6);border-radius:20px;padding:5px 11px;font-size:13px;z-index:4;pointer-events:none;display:none}

  #status{font-size:13px;color:#9a9aa8;padding:6px 12px;background:#0a0a0a;border-top:1px solid #1d1d1d;border-bottom:1px solid #1d1d1d;min-height:28px}

  /* الخلفية السوداء للترجمة */
  #outBox{flex:1;min-height:0;background:#000;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column}
  #fitArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #current{width:100%;text-align:center;line-height:1.35;font-weight:900;color:#fff;white-space:pre-wrap;word-break:break-word}
  #current.empty{color:#555;font-weight:400}
  #current.pop{animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #orig{direction:ltr;text-align:left;color:#7d7d8a;font-size:14px;margin-top:6px;line-height:1.5}
  #logPanel{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
  #logPanel[hidden]{display:none}
  #logHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  #logHead h2{font-size:22px}
  #logBtns{display:flex;gap:8px;margin-bottom:10px}
  #logBtns button,#logClose{flex:1;border:1px solid #333;background:#1a1a22;color:#fff;border-radius:12px;padding:10px;font-size:15px;font-weight:700}
  #logClose{flex:0 0 auto;padding:10px 16px}
  #logList{flex:1;overflow-y:auto;-webkit-user-select:text;user-select:text}
  .li{padding:12px 4px;border-bottom:1px solid #1d1d1d}
  .li .ar{font-size:22px;font-weight:800;line-height:1.5}
  .li .en{direction:ltr;text-align:left;color:#7d7d8a;font-size:14px;margin-top:4px}
  .li .tm{color:#555;font-size:12px;margin-top:4px}
  #logEmpty{color:#666;text-align:center;margin-top:40px;font-size:18px}

  /* الأزرار آخر شي تحت */
  #bottom{padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#0d0d12;border-top:1px solid #222}
  #tools{display:flex;gap:8px;margin-bottom:8px}
  #tools button{flex:1;border:1px solid #333;background:#1a1a22;color:#fff;border-radius:12px;padding:10px 4px;font-size:14px;font-weight:700;white-space:nowrap}
  #startBtn{width:100%;border:0;border-radius:16px;padding:16px;font-size:22px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#00c853,#00a152);box-shadow:0 4px 18px rgba(0,200,83,.35);transition:.2s}
  #startBtn.on{background:linear-gradient(135deg,#ff3d3d,#c40000);box-shadow:0 4px 18px rgba(255,0,0,.35)}
  #startBtn:active{transform:scale(.98)}
  #settings{margin-bottom:8px;background:#15151c;border:1px solid #2a2a35;border-radius:12px;padding:10px;display:grid;gap:9px;font-size:15px;max-height:42dvh;overflow-y:auto}
  #settings[hidden]{display:none}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row select,.row input[type=range]{flex:1;max-width:60%}
  select{background:#000;color:#fff;border:1px solid #444;border-radius:8px;padding:7px;font-size:15px}
  input[type=checkbox]{width:22px;height:22px;accent-color:#00c853}
</style>
</head>
<body>
<div id="app">

  <div id="camBox">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="lensTag"></div>
    <div id="zoomTag">١×</div>
    <div id="camTools">
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
      <button id="lensBtn">🔄</button>
    </div>
    <div id="camMsg">اضغط هنا لتشغيل الكاميرا</div>
  </div>

  <div id="status">جاهز</div>

  <div id="outBox">
    <div id="fitArea"><div id="current" class="empty">الترجمة العربية بتطلع هنا…</div></div>
    <div id="orig"></div>
  </div>

  <div id="logPanel" hidden>
    <div id="logHead"><h2>📜 سجل الترجمات</h2><button id="logClose">✖ إغلاق</button></div>
    <div id="logBtns"><button id="logCopy">📋 نسخ الكل</button><button id="logWipe">🗑️ مسح السجل</button></div>
    <div id="logList"></div>
  </div>

  <div id="bottom">
    <div id="settings" hidden>
      <div class="row"><span>لغة اللعبة</span>
        <select id="lang">
          <option value="eng">الإنجليزية</option>
          <option value="jpn">اليابانية</option>
          <option value="chi_sim">الصينية</option>
          <option value="kor">الكورية</option>
          <option value="fra">الفرنسية</option>
          <option value="spa">الإسبانية</option>
          <option value="deu">الألمانية</option>
          <option value="rus">الروسية</option>
          <option value="por">البرتغالية</option>
          <option value="ita">الإيطالية</option>
          <option value="tur">التركية</option>
        </select></div>
      <div class="row"><span>سرعة الالتقاط</span>
        <select id="speed">
          <option value="600">سريع جداً</option>
          <option value="1200" selected>سريع</option>
          <option value="2000">متوسط</option>
          <option value="3500">بطيء</option>
        </select></div>
      <div class="row"><span>ألوان النص</span>
        <select id="inv">
          <option value="auto">تلقائي</option>
          <option value="on">نص فاتح على خلفية غامقة</option>
          <option value="off">نص غامق على خلفية فاتحة</option>
        </select></div>
      <div class="row"><span>أكبر حجم للخط</span><input type="range" id="fmax" min="40" max="200" value="140"></div>
      <div class="row"><span>نطق الترجمة بالصوت</span><input type="checkbox" id="speak"></div>
      <div class="row"><span>عرض النص الأصلي</span><input type="checkbox" id="showOrig"></div>
    </div>
    <div id="tools">
      <button id="clearBtn">🧹 مسح</button>
      <button id="logBtn">📜 السجل</button>
      <button id="resetBox">🔲 المربع</button>
      <button id="setBtn">⚙️ الإعدادات</button>
    </div>
    <button id="startBtn">▶ ابدأ الترجمة</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), ov = $('overlay'), octx = ov.getContext('2d');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently: true });

let stream = null, track = null, worker = null, workerLang = null;
let running = false, timer = null, wakeLock = null;
let lastText = '';
let shownThumb = null, candidate = null, stableCount = 0, skipCount = 0;
const cache = new Map();

/* التقريب */
let nativeZoom = null;   // إذا الجوال يدعم تقريب الكاميرا الحقيقي
let zoom = 1, digitalZoom = 1;
let lenses = [], lensIndex = 0;

function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

/* المربع الأصفر — نسبته من مساحة الكاميرا على الشاشة */
const DEFAULT_BOX = { x:.06, y:.55, w:.88, h:.3 };
let region = load('gt_box', DEFAULT_BOX);

/* ===== الإعدادات المحفوظة ===== */
['lang','speed','inv','fmax','speak','showOrig'].forEach(id => {
  const el = $(id), v = load('gt_'+id, null);
  if (v !== null){ if (el.type === 'checkbox') el.checked = v; else el.value = v; }
  el.addEventListener('change', () => { save('gt_'+id, el.type === 'checkbox' ? el.checked : el.value); applySettings(); });
  el.addEventListener('input', applySettings);
});
function applySettings(){
  $('orig').style.display = $('showOrig').checked ? 'block' : 'none';
  if (typeof fitText === 'function') fitText();
}
applySettings();
function setStatus(t){ $('status').textContent = t; }

/* ===== الكاميرا ===== */
async function openStream(deviceId){
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = deviceId
    ? { deviceId:{ exact:deviceId }, width:{ ideal:1920 }, height:{ ideal:1080 } }
    : { facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } };
  stream = await navigator.mediaDevices.getUserMedia({ video:v, audio:false });
  video.srcObject = stream;
  await video.play();
  track = stream.getVideoTracks()[0];
  nativeZoom = null;
  try{
    const c = track.getCapabilities ? track.getCapabilities() : {};
    if (c.focusMode && c.focusMode.includes('continuous')) track.applyConstraints({ advanced:[{ focusMode:'continuous' }] }).catch(()=>{});
    if (c.zoom && c.zoom.max > c.zoom.min) nativeZoom = { min:c.zoom.min, max:Math.min(c.zoom.max, 15) };
  }catch(e){}
  zoom = nativeZoom ? nativeZoom.min : 1;
  applyZoom();
}

async function startCamera(){
  if (stream) return true;
  try{
    await openStream(null);
    $('camMsg').style.display = 'none';
    await findLenses();
    setTimeout(resizeOverlay, 100);
    setStatus('الكاميرا شغالة — حرّك المربع الأصفر على مكان النص ثم اضغط ابدأ الترجمة');
    return true;
  }catch(e){
    stream = null;
    $('camMsg').textContent = 'ما قدرت أشغل الكاميرا. اضغط هنا واسمح باستخدام الكاميرا';
    $('camMsg').style.display = 'flex';
    setStatus('الكاميرا مو شغالة');
    return false;
  }
}
$('camMsg').onclick = startCamera;
video.addEventListener('loadedmetadata', resizeOverlay);
window.addEventListener('resize', () => setTimeout(resizeOverlay, 150));

/* ===== العدسات (العادية / الواسعة / المقربة) ===== */
function lensName(label, i){
  const l = (label || '').toLowerCase();
  if (/ultra|واسعة جد|فائقة/.test(l)) return 'العدسة الواسعة جداً';
  if (/tele|مقرب/.test(l)) return 'العدسة المقرّبة';
  if (/triple|ثلاث/.test(l)) return 'الكاميرا الثلاثية';
  if (/dual|مزدوج/.test(l)) return 'الكاميرا المزدوجة';
  return 'العدسة ' + toAr(i + 1);
}
async function findLenses(){
  try{
    const all = await navigator.mediaDevices.enumerateDevices();
    lenses = all.filter(d => d.kind === 'videoinput' && !/front|أمام|facetime/i.test(d.label));
    const cur = track && track.getSettings ? track.getSettings().deviceId : null;
    const idx = lenses.findIndex(d => d.deviceId === cur);
    lensIndex = idx >= 0 ? idx : 0;
    $('lensBtn').style.display = lenses.length > 1 ? 'block' : 'none';
  }catch(e){ lenses = []; $('lensBtn').style.display = 'none'; }
}
let lensTagTimer = null;
$('lensBtn').onclick = async () => {
  if (!stream) return startCamera();
  if (lenses.length < 2) return;
  lensIndex = (lensIndex + 1) % lenses.length;
  const d = lenses[lensIndex];
  try{
    await openStream(d.deviceId);
    $('lensTag').textContent = lensName(d.label, lensIndex);
    $('lensTag').style.display = 'block';
    clearTimeout(lensTagTimer); lensTagTimer = setTimeout(() => $('lensTag').style.display = 'none', 2500);
    resetStable();
    setTimeout(resizeOverlay, 100);
  }catch(e){ setStatus('ما قدرت أغيّر العدسة'); }
};

/* ===== التقريب والتبعيد ===== */
function zoomLimits(){ return nativeZoom ? nativeZoom : { min:1, max:6 }; }
function applyZoom(){
  const L = zoomLimits();
  zoom = Math.max(L.min, Math.min(L.max, zoom));
  if (nativeZoom && track){
    digitalZoom = 1;
    track.applyConstraints({ advanced:[{ zoom }] }).catch(()=>{});
  } else {
    digitalZoom = zoom;
  }
  video.style.transform = 'scale(' + digitalZoom + ')';
  $('zoomTag').textContent = toAr((Math.round(zoom * 10) / 10).toString()) + '×';
  draw();
}
$('zoomIn').onclick = () => { zoom *= 1.25; applyZoom(); };
$('zoomOut').onclick = () => { zoom /= 1.25; applyZoom(); };

/* ===== أبعاد الفيديو على الشاشة ===== */
function vidRect(){
  const cw = ov.clientWidth, ch = ov.clientHeight;
  const vw = video.videoWidth || 16, vh = video.videoHeight || 9;
  const s = Math.max(cw / vw, ch / vh) * digitalZoom;
  const w = vw * s, h = vh * s;
  return { x:(cw - w) / 2, y:(ch - h) / 2, w, h, s };
}
function resizeOverlay(){
  const dpr = window.devicePixelRatio || 1;
  ov.width = ov.clientWidth * dpr; ov.height = ov.clientHeight * dpr;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
function boxPx(){
  const W = ov.clientWidth, H = ov.clientHeight;
  return { x:region.x * W, y:region.y * H, w:region.w * W, h:region.h * H };
}
function draw(){
  const W = ov.clientWidth, H = ov.clientHeight;
  octx.clearRect(0, 0, W, H);
  if (!stream) return;
  const b = boxPx();
  octx.fillStyle = 'rgba(0,0,0,.45)'; octx.fillRect(0, 0, W, H); octx.clearRect(b.x, b.y, b.w, b.h);
  const col = running ? '#00e676' : '#ffd400';
  octx.lineWidth = 3; octx.strokeStyle = col; octx.strokeRect(b.x, b.y, b.w, b.h);
  // مقابض الزوايا للتكبير والتصغير
  octx.fillStyle = col;
  [[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]].forEach(([x,y]) => {
    octx.beginPath(); octx.arc(x, y, 11, 0, Math.PI * 2); octx.fill();
    octx.lineWidth = 2; octx.strokeStyle = '#000'; octx.stroke();
  });
  // علامة السحب بالنص
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  if (b.w > 70 && b.h > 50){
    octx.fillStyle = 'rgba(0,0,0,.45)'; octx.beginPath(); octx.arc(cx, cy, 18, 0, Math.PI * 2); octx.fill();
    octx.strokeStyle = col; octx.lineWidth = 2.5;
    octx.beginPath();
    octx.moveTo(cx - 10, cy); octx.lineTo(cx + 10, cy); octx.moveTo(cx, cy - 10); octx.lineTo(cx, cy + 10);
    octx.stroke();
  }
}

/* ===== لمس: إصبع واحد يحرك المربع، إصبعين للتقريب ===== */
const pointers = new Map();
let action = null; // {type:'move'|'resize'|'new', ...}
let pinch = null;

function localPt(e){ const r = ov.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
function hitTest(p){
  const b = boxPx(), R = 34;
  const corners = [['tl',b.x,b.y],['tr',b.x+b.w,b.y],['bl',b.x,b.y+b.h],['br',b.x+b.w,b.y+b.h]];
  for (const [n,x,y] of corners) if (Math.hypot(p.x - x, p.y - y) < R) return { type:'resize', corner:n };
  if (p.x > b.x - 10 && p.x < b.x + b.w + 10 && p.y > b.y - 10 && p.y < b.y + b.h + 10) return { type:'move' };
  return { type:'new' };
}
ov.addEventListener('pointerdown', e => {
  if (!stream) return;
  ov.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, localPt(e));
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.x - b.x, a.y - b.y), z:zoom };
    action = null; return;
  }
  if (pointers.size === 1){
    const p = localPt(e), h = hitTest(p);
    action = { ...h, start:p, box:{ ...boxPx() } };
  }
});
ov.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, localPt(e));
  if (pinch && pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoom = pinch.z * d / Math.max(20, pinch.d); applyZoom(); return;
  }
  if (!action) return;
  const p = localPt(e), W = ov.clientWidth, H = ov.clientHeight, s = action.start, o = action.box;
  const dx = p.x - s.x, dy = p.y - s.y, MIN = 40;
  let x = o.x, y = o.y, w = o.w, h = o.h;
  if (action.type === 'move'){
    x = Math.max(0, Math.min(W - w, o.x + dx)); y = Math.max(0, Math.min(H - h, o.y + dy));
  } else if (action.type === 'resize'){
    let x1 = o.x, y1 = o.y, x2 = o.x + o.w, y2 = o.y + o.h;
    if (action.corner.includes('l')) x1 = Math.min(x2 - MIN, o.x + dx); else x2 = Math.max(x1 + MIN, x2 + dx);
    if (action.corner.includes('t')) y1 = Math.min(y2 - MIN, o.y + dy); else y2 = Math.max(y1 + MIN, y2 + dy);
    x1 = Math.max(0, x1); y1 = Math.max(0, y1); x2 = Math.min(W, x2); y2 = Math.min(H, y2);
    x = x1; y = y1; w = x2 - x1; h = y2 - y1;
  } else {
    if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;
    x = Math.max(0, Math.min(s.x, p.x)); y = Math.max(0, Math.min(s.y, p.y));
    w = Math.min(W, Math.max(s.x, p.x)) - x; h = Math.min(H, Math.max(s.y, p.y)) - y;
    if (w < MIN || h < MIN) return;
  }
  region = { x:x / W, y:y / H, w:w / W, h:h / H };
  draw();
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0 && action){ action = null; save('gt_box', region); resetStable(); }
}
ov.addEventListener('pointerup', endPointer);
ov.addEventListener('pointercancel', endPointer);
document.addEventListener('gesturestart', e => e.preventDefault());

$('resetBox').onclick = () => { region = { ...DEFAULT_BOX }; save('gt_box', region); resetStable(); draw(); };
$('setBtn').onclick = () => { $('settings').hidden = !$('settings').hidden; setTimeout(fitText, 30); };
$('clearBtn').onclick = () => {
  resetStable(); $('orig').textContent = '';
  $('current').className = 'empty'; $('current').textContent = 'الترجمة العربية بتطلع هنا…';
  fitText();
};

/* ===== محرك قراءة النصوص ===== */
async function ensureWorker(){
  const lang = $('lang').value;
  if (worker && workerLang === lang) return;
  if (worker){ try{ await worker.terminate(); }catch(e){} worker = null; }
  setStatus('جاري تحميل محرك قراءة النصوص… (أول مرة ياخذ شوي)');
  worker = await Tesseract.createWorker(lang, 1, {
    logger: m => { if (m.progress != null && /load|init/i.test(m.status || '')) setStatus('جاري التحميل ' + toAr(Math.round(m.progress * 100)) + '٪'); }
  });
  await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
  workerLang = lang;
}

/* ===== قص الجزء اللي داخل المربع وتجهيزه ===== */
function capture(){
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const r = vidRect(), b = boxPx();
  let sx = (b.x - r.x) / r.s, sy = (b.y - r.y) / r.s, sw = b.w / r.s, sh = b.h / r.s;
  sx = Math.max(0, sx); sy = Math.max(0, sy);
  sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
  if (sw < 8 || sh < 8) return null;
  const scale = Math.max(1, Math.min(3, 1400 / sw));
  work.width = Math.round(sw * scale); work.height = Math.round(sh * scale);
  wctx.imageSmoothingQuality = 'high';
  wctx.drawImage(video, sx, sy, sw, sh, 0, 0, work.width, work.height);
  const img = wctx.getImageData(0, 0, work.width, work.height), d = img.data, n = d.length / 4;
  const g = new Uint8ClampedArray(n), hist = new Uint32Array(256); let sum = 0;
  for (let i = 0, j = 0; i < n; i++, j += 4){ const v = (d[j]*.299 + d[j+1]*.587 + d[j+2]*.114) | 0; g[i] = v; hist[v]++; sum += v; }
  let lo = 0, hi = 255, acc = 0;
  for (let i = 0; i < 256; i++){ acc += hist[i]; if (acc > n * .02){ lo = i; break; } }
  acc = 0; for (let i = 255; i >= 0; i--){ acc += hist[i]; if (acc > n * .02){ hi = i; break; } }
  const range = Math.max(30, hi - lo), mode = $('inv').value;
  const invert = mode === 'on' || (mode === 'auto' && sum / n < 115);
  for (let i = 0, j = 0; i < n; i++, j += 4){
    let v = (g[i] - lo) * 255 / range; v = v < 0 ? 0 : v > 255 ? 255 : v;
    if (invert) v = 255 - v;
    d[j] = d[j+1] = d[j+2] = v; d[j+3] = 255;
  }
  wctx.putImageData(img, 0, 0);
  return work;
}

/* ===== تنظيف ومقارنة النص ===== */
function clean(t){
  // نشيل الرموز الغريبة اللي تطلع بالغلط مثل ¥ $ © »
  t = t.replace(/[^\p{L}\p{N}\s.,!?'’:;()\-]/gu, ' ');
  return t.split(/\s+/).filter(w => {
    const core = w.replace(/[^\p{L}\p{N}]/gu, '');
    if (!core) return false;
    if (core.length === 1 && !/^[aAIi0-9぀-ヿ一-鿿가-힯]$/.test(core)) return false;
    return true;
  }).join(' ').trim();
}
function meaningful(t){
  const letters = (t.match(/\p{L}/gu) || []).length;
  return letters >= 3 && letters / t.replace(/\s/g, '').length > .6;
}
function norm(s){ return s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, ''); }
function similarity(a, b){
  a = norm(a).slice(0, 400); b = norm(b).slice(0, 400);
  if (!a || !b) return 0; if (a === b) return 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++){
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return 1 - prev[b.length] / Math.max(a.length, b.length);
}

/* ===== ثبات الكلام: ما يتغير إلا إذا تغير النص فعلاً ===== */
const thumbC = document.createElement('canvas'); thumbC.width = 64; thumbC.height = 20;
const thumbX = thumbC.getContext('2d', { willReadFrequently: true });
function makeThumb(src){
  thumbX.drawImage(src, 0, 0, 64, 20);
  const d = thumbX.getImageData(0, 0, 64, 20).data, out = new Uint8Array(64 * 20);
  for (let i = 0, j = 0; i < out.length; i++, j += 4) out[i] = d[j];
  return out;
}
function thumbDiff(a, b){
  if (!a || !b) return 255;
  let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
  return s / a.length;
}
function words(t){ return new Set((t.toLowerCase().match(/[\p{L}\p{N}]{2,}/gu) || [])); }
function wordSim(a, b){
  const A = words(a), B = words(b);
  if (!A.size || !B.size) return 0;
  let inter = 0; A.forEach(w => { if (B.has(w)) inter++; });
  return 2 * inter / (A.size + B.size);
}
function sameText(a, b){ return Math.max(wordSim(a, b), similarity(a, b)); }
function resetStable(){ lastText = ''; shownThumb = null; candidate = null; stableCount = 0; }

/* ===== الترجمة (مجانية) ===== */
const srcMap = { eng:'en', jpn:'ja', chi_sim:'zh-CN', kor:'ko', fra:'fr', spa:'es', deu:'de', rus:'ru', por:'pt', ita:'it', tur:'tr' };
async function translate(text){
  if (cache.has(text)) return cache.get(text);
  let out = '';
  try{
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=' + encodeURIComponent(text));
    const j = await r.json();
    out = j[0].map(x => x[0]).join('');
  }catch(e){
    const src = srcMap[$('lang').value] || 'en';
    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.slice(0, 480)) + '&langpair=' + src + '|ar');
    const j = await r.json();
    out = j.responseData && j.responseData.translatedText || '';
  }
  if (out) cache.set(text, out);
  return out;
}

/* ===== العرض والصوت ===== */
function show(ar, original){
  const cur = $('current');
  cur.className = ''; void cur.offsetWidth; cur.className = 'pop';
  cur.textContent = ar;
  $('orig').textContent = original;
  fitText();
  addLog(ar, original);
  if ($('speak').checked) speak(ar);
}

/* ===== الخط يكبر لين يعبّي الخلفية السوداء ===== */
function fitText(){
  const area = $('fitArea'), cur = $('current');
  const W = area.clientWidth, H = area.clientHeight;
  if (!W || !H) return;
  const max = cur.classList.contains('empty') ? 26 : +$('fmax').value;
  let lo = 16, hi = max;
  while (hi - lo > 1){
    const mid = (lo + hi) >> 1;
    cur.style.fontSize = mid + 'px';
    if (cur.scrollHeight <= H && cur.scrollWidth <= W) lo = mid; else hi = mid;
  }
  cur.style.fontSize = lo + 'px';
}
window.addEventListener('resize', () => setTimeout(fitText, 200));

/* ===== سجل كل الترجمات ===== */
let logList = load('gt_log', []);
function addLog(ar, original){
  if (logList.length && logList[0].ar === ar) return;
  logList.unshift({ ar, en:original, t:Date.now() });
  if (logList.length > 1000) logList = logList.slice(0, 1000);
  save('gt_log', logList);
  if (!$('logPanel').hidden) renderLog();
}
function fmtTime(t){
  const d = new Date(t);
  let hh = d.getHours(), mm = d.getMinutes();
  const pm = hh >= 12; hh = hh % 12 || 12;
  return toAr(hh) + ':' + toAr(String(mm).padStart(2, '0')) + (pm ? ' م' : ' ص') + ' — ' + toAr(d.getDate()) + '/' + toAr(d.getMonth() + 1);
}
function renderLog(){
  const box = $('logList'); box.innerHTML = '';
  if (!logList.length){ const e = document.createElement('div'); e.id = 'logEmpty'; e.textContent = 'ما فيه ترجمات للحين'; box.appendChild(e); return; }
  logList.forEach(it => {
    const li = document.createElement('div'); li.className = 'li';
    const a = document.createElement('div'); a.className = 'ar'; a.textContent = it.ar;
    const e = document.createElement('div'); e.className = 'en'; e.textContent = it.en;
    const m = document.createElement('div'); m.className = 'tm'; m.textContent = fmtTime(it.t);
    li.append(a, e, m); box.appendChild(li);
  });
}
$('logBtn').onclick = () => { renderLog(); $('logPanel').hidden = false; };
$('logClose').onclick = () => { $('logPanel').hidden = true; };
$('logCopy').onclick = async () => {
  const txt = logList.slice().reverse().map(i => i.ar + '\n' + i.en).join('\n\n');
  try{ await navigator.clipboard.writeText(txt); $('logCopy').textContent = '✅ تم النسخ'; }
  catch(e){ $('logCopy').textContent = '⚠️ ما قدرت أنسخ'; }
  setTimeout(() => $('logCopy').textContent = '📋 نسخ الكل', 1800);
};
let wipeArmed = false;
$('logWipe').onclick = () => {
  if (!wipeArmed){ wipeArmed = true; $('logWipe').textContent = '⚠️ اضغط مرة ثانية للتأكيد'; setTimeout(() => { wipeArmed = false; $('logWipe').textContent = '🗑️ مسح السجل'; }, 3000); return; }
  wipeArmed = false; logList = []; save('gt_log', logList); renderLog(); $('logWipe').textContent = '🗑️ مسح السجل';
};
function speak(t){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ar-SA'; u.rate = 1.05;
    const v = speechSynthesis.getVoices().find(v => /^ar/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ===== حلقة الترجمة ===== */
async function tick(){
  if (!running) return;
  try{
    await ensureWorker();
    if (!running) return;
    const c = capture();
    if (c){
      const thumb = makeThumb(c);
      skipCount++;
      // إذا الصورة داخل المربع ما تغيرت عن آخر ترجمة، نخلي الترجمة مثل ما هي (ونتأكد كل شوي)
      if (shownThumb && thumbDiff(thumb, shownThumb) < 6 && skipCount < 5){
        if (running) setStatus('🟢 الترجمة شغالة — أي نص يطلع بالمربع يتترجم');
      } else {
        skipCount = 0;
        setStatus('👀 أقرأ النص…');
        const { data } = await worker.recognize(c);
        const lines = (data.lines || []).filter(l => clean(l.text));
        let good = lines.filter(l => l.confidence > 30);
        let text = good.length ? good.map(l => l.text).join(' ') : (data.text || '');
        text = clean(text);
        const conf = good.length ? good.reduce((a, l) => a + l.confidence, 0) / good.length : (data.confidence || 0);
        if (!meaningful(text)){
          candidate = null; stableCount = 0;
          if (running) setStatus('🟡 ما لقيت نص واضح داخل المربع — قرّب الكاميرا أو كبّر المربع على الكلام');
        } else if (lastText && sameText(text, lastText) > .6 && text.length < lastText.length * 1.3){
          // نفس الكلام بس القراءة اختلفت شوي — ما نغير شي
          shownThumb = thumb; candidate = null; stableCount = 0;
          if (running) setStatus('🟢 الترجمة شغالة — أي نص يطلع بالمربع يتترجم');
        } else {
          // إذا القراءة واضحة نترجم على طول، وإذا مو واضحة ننتظر قراءة ثانية تأكدها
          if (candidate && sameText(text, candidate) > .5){ stableCount++; if (text.length > candidate.length) candidate = text; }
          else { candidate = text; stableCount = 1; }
          if (stableCount >= 2 || conf >= 65 || !lastText){
            const finalText = candidate;
            candidate = null; stableCount = 0;
            setStatus('🔄 جاري الترجمة…');
            const ar = await translate(finalText);
            if (ar && running){
              lastText = finalText; shownThumb = thumb;
              if (ar.trim() !== $('current').textContent.trim()) show(ar, finalText);
            }
          }
          if (running) setStatus('🟢 الترجمة شغالة — أي نص يطلع بالمربع يتترجم');
        }
      }
    }
  }catch(e){
    setStatus('⚠️ صارت مشكلة، تأكد من الإنترنت… أحاول مرة ثانية');
  }
  if (running) timer = setTimeout(tick, +$('speed').value);
}

async function keepAwake(on){
  try{
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock){ wakeLock.release(); wakeLock = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') keepAwake(true); });

$('startBtn').onclick = async () => {
  if (running){
    running = false; clearTimeout(timer); keepAwake(false);
    $('startBtn').classList.remove('on'); $('startBtn').textContent = '▶ ابدأ الترجمة';
    setStatus('تم إيقاف الترجمة'); draw(); return;
  }
  if (!(await startCamera())) return;
  if (typeof Tesseract === 'undefined'){ setStatus('⚠️ ما تحمل محرك القراءة، تأكد من الإنترنت وحدّث الصفحة'); return; }
  running = true; resetStable();
  $('startBtn').classList.add('on'); $('startBtn').textContent = '⏹ إيقاف الترجمة';
  keepAwake(true); draw(); tick();
};

$('lensBtn').style.display = 'none';
setTimeout(fitText, 50);
startCamera();
</script>
